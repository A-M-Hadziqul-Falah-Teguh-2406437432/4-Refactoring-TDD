<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h3>Pay Order</h3>

    <p>Order ID: <span id="orderIdLabel" th:text="${order.id}"></span></p>
    <p>Author: <span id="orderAuthorLabel" th:text="${order.author}"></span></p>

    <form method="post" th:action="@{/order/pay/{orderId}(orderId=${order.id})}">
        <div class="form-group">
            <label for="methodSelect">Payment Method</label>
            <select id="methodSelect" name="method" class="form-control col-6">
                <option value="VOUCHER">VOUCHER</option>
                <option value="BANK_TRANSFER">BANK_TRANSFER</option>
            </select>
        </div>

        <div class="form-group">
            <label for="voucherCodeInput">Voucher Code</label>
            <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control col-6" placeholder="ESHOP1234ABC5678">
        </div>

        <div class="form-group">
            <label for="bankNameInput">Bank Name</label>
            <input id="bankNameInput" name="bankName" type="text" class="form-control col-6" placeholder="BCA">
        </div>

        <div class="form-group">
            <label for="referenceCodeInput">Reference Code</label>
            <input id="referenceCodeInput" name="referenceCode" type="text" class="form-control col-6" placeholder="REF123456789012">
        </div>

        <button id="payButton" type="submit" class="btn btn-primary">Pay</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
