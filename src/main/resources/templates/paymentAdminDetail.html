<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h3>Payment Admin Detail</h3>
    <p>Payment ID: <span id="paymentIdLabel" th:text="${payment.id}"></span></p>
    <p>Status: <span id="paymentStatusLabel" th:text="${payment.status}"></span></p>

    <form method="post" th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}">
        <div class="form-group">
            <label for="statusSelect">Status</label>
            <select id="statusSelect" name="status" class="form-control col-4">
                <option value="SUCCESS">SUCCESS</option>
                <option value="REJECTED">REJECTED</option>
            </select>
        </div>
        <button id="setStatusButton" type="submit" class="btn btn-primary">Set Status</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
